name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install locked CPU verification environment
        run: uv sync --locked --group dev --extra benchmarks

      - name: Check dependency lock
        run: uv lock --check

      - name: Lint and format
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Type-check
        run: uv run ty check src

      - name: Run CPU-safe tests
        run: uv run pytest -q

      - name: Check exploratory manuscript assets
        run: uv run python scripts/build_exploratory_paper_assets.py --check

      - name: Build wheel and source distribution
        run: uv build

      - name: Exercise CLI surface outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/sycophancy-steering" --help
          "$GITHUB_WORKSPACE/.venv/bin/sycophancy-steering" --version
